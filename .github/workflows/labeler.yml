# https://github.com/actions/labeler

name: PR Labels
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - review_requested

jobs:
  labeler:
    # The token policy is scoped to DataDog/integrations-core and rejects fork repositories.
    if: ${{ github.repository_owner == 'DataDog' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read # Needed for labeler-reusable.yml
      id-token: write # Needed for dd-octo-sts OIDC token exchange
      pull-requests: write # Needed for labeler-reusable.yml
    uses: ./.github/workflows/labeler-reusable.yml
