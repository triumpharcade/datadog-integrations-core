name: PR All

on:
  pull_request:
    paths:
      - datadog_checks_base/datadog_checks/**
      - datadog_checks_base/pyproject.toml
      - datadog_checks_dev/datadog_checks/dev/*.py
      - datadog_checks_dev/pyproject.toml
      - ddev/src/**
      - ddev/pyproject.toml
      - "!agent_requirements.in"
      # Also run if we modify the workflow files
      - ".github/workflows/pr-all.yml"
      - ".github/workflows/test-target.yml"
      - ".github/workflows/test-all.yml"
      # Also run if the action to install test-target scripts changes
      - ".github/actions/setup-test-target-scripts/**"
      - ".github/actions/setup-ddev/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'DataDog'
    uses: ./.github/workflows/test-all.yml

    permissions:
      # needed for compute-matrix in test-target.yml
      contents: read
      # needed for dd-sts in test-target.yml
      id-token: write

    with:
      repo: core
      context: "pr"
      # Avoid running flaky tests since the intention of running everything in these
      # prs is to ensure that tests can be run sucessfully. Reporting failed flaky tests
      # does not provide much value.
      pytest-args: '-m "not flaky"'

    secrets: inherit

  fork-postgres-matrix:
    if: github.repository_owner != 'DataDog'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Compute Postgres matrix
        id: compute
        shell: python
        env:
          PYTHONPATH: ddev/src
        run: |
          import json
          import os
          from pathlib import Path

          from ddev.utils.scripts.ci_matrix import construct_job_matrix

          matrix = construct_job_matrix(Path.cwd(), ['postgres'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={json.dumps(matrix)}\n')

  fork-postgres-test:
    if: github.repository_owner != 'DataDog'
    needs: fork-postgres-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.fork-postgres-matrix.outputs.matrix) }}
    uses: ./.github/workflows/test-target.yml
    permissions:
      contents: read
      id-token: write
    with:
      job-name: Postgres
      target: ${{ matrix.target }}
      target-env: ${{ matrix.target-env }}
      platform: ${{ matrix.platform }}
      runner: ${{ toJson(matrix.runner) }}
      repo: core
      context: pr
      pytest-args: '-m "not flaky"'

  save-event:
    needs:
      - test
    if: github.repository_owner == 'DataDog' && (success() || failure())

    uses: ./.github/workflows/save-event.yml

  upload-coverage:
    needs:
      - test
    if: >
      github.repository_owner == 'DataDog' &&
      !github.event.repository.private &&
      (success() || failure())
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Datadog credentials
        id: dd-sts
        # Coverage upload is optional; keep non-blocking so fork PRs and OIDC outages don't fail the job
        continue-on-error: true
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-coverage-api-key

      - name: Download all coverage artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false

      - name: Upload coverage to Datadog
        if: always()
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@6c4bd935248daa6f0ef94e3e6ba71ad5ad079998 # v1.0.3
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: coverage-reports
          format: cobertura
