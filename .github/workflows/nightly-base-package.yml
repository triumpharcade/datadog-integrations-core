name: Nightly minimum base package test

on:
  # Triggering minimum base package tests can be useful outside of the schedule, for instance for PRs
  # that add new integrations or ones that bump the Pydantic dependency in the base package.
  # Until we figure out how best to trigger these automatically we're leaving the door open to easily
  # trigger this manually with the right branch.
  workflow_dispatch:
  schedule:
  # 5 AM UTC
  - cron: "0 5 * * *"

jobs:
  test:
    if: github.event_name != 'schedule' || github.repository_owner == 'DataDog'
    uses: ./.github/workflows/test-all.yml

    permissions:
       # needed for compute-matrix in test-target.yml
       contents: read
       # needed for dd-sts in test-target.yml
       id-token: write

    with:
      repo: core

      # Options
      minimum-base-package: true
      pytest-args: '-m "not flaky"'
      context: "nightly-base-package"
    secrets: inherit

  fork-postgres-test:
    if: github.event_name == 'schedule' && github.repository_owner != 'DataDog'
    uses: ./.github/workflows/test-target.yml
    permissions:
      contents: read
      id-token: write
    with:
      job-name: Minimum base package Postgres
      target: postgres
      platform: linux
      runner: '["ubuntu-22.04"]'
      repo: core
      minimum-base-package: true
      pytest-args: '-m "not flaky"'
      context: fork-nightly-base-package
      # Run all Postgres environments sequentially, unlike the upstream job matrix.
      step-timeout-minutes: 120
